services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: groww
      POSTGRES_PASSWORD: groww
      POSTGRES_DB: growwdesk
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/store/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groww -d growwdesk"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://groww:groww@postgres:5432/growwdesk
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: python -m app.worker
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://groww:groww@postgres:5432/growwdesk
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: always

volumes:
  pgdata:
  redisdata:
