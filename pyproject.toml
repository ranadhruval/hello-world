[project]
name = "groww-desk"
version = "0.1.0"
description = "WhatsApp assistant over the Groww trading API"
requires-python = ">=3.11"
dependencies = [
    "growwapi>=1.5.0",
    "pyotp>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # The link page posts a form, and FastAPI's Form(...) refuses to even build
    # the route without this. Missing it fails at import, not at request time.
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "cryptography>=43.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.9.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
